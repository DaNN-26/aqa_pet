version: '3.8'

services:
  jenkins:
    build: .
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - selenoid-network

  selenoid:
    image: aerokube/selenoid:latest-release
    container_name: selenoid
    ports:
      - "4444:4444"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./selenoid-config:/etc/selenoid
    networks:
      - selenoid-network
    command: ["-container-network", "selenoid-network"]

  selenoid-ui:
    image: aerokube/selenoid-ui:latest-release
    container_name: selenoid-ui
    ports:
      - "8081:8080"
    depends_on:
      - selenoid
    networks:
      - selenoid-network
    command: ["--selenoid-uri", "http://selenoid:4444"]

networks:
  selenoid-network:
    driver: bridge

volumes:
  jenkins_home: